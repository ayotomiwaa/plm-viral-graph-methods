[project]
name = "protein-embedding-graph-validation"
version = "0.1.0"
description = "Method-validation workflows for Hamming and PLM embedding graph analyses of viral sequences."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "numba",
  "biopython",
]

[project.optional-dependencies]
embeddings = [
  "torch",
  "transformers",
]
trees = [
  "scikit-bio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
